name: Bug report
description: Something in flume-report isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The `flume-report` command/flags you ran.
      placeholder: "flume-report --days 3 --bucket HR --device-id <id> --units LITERS"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error message
      description: Full output, including any `error: ...` message and exit code. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show flume-report` (or the commit/branch you're on).
    validations:
      required: false
  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14+"
        - Other (see additional context)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — e.g. number of devices, bucket size, date range, whether it involves the rate limit or token cache.
    validations:
      required: false
